name: Seedling Backend CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './backend/package.json'

    - name: Install dependencies
      run: |
        cd backend
        npm ci

    - name: Generate Prisma Client & Push Database Schema
      run: |
        cd backend
        npx prisma db push
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:5432/postgres?schema=public

    - name: Run tests
      run: |
        cd backend
        npm test
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:5432/postgres?schema=public
        JWT_ACCESS_SECRET: test_jwt_access_secret_key_very_long_and_secure
        JWT_REFRESH_SECRET: test_jwt_refresh_secret_key_very_long_and_secure

    - name: Build TypeScript output
      run: |
        cd backend
        npm run build
